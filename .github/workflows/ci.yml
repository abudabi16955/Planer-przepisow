name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planer
          POSTGRES_DB: planer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planer -d planer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://planer@localhost:5432/planer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -e 'backend[dev]'
      - run: backend/.venv/bin/ruff check backend
      - run: backend/.venv/bin/ruff format --check backend
      - run: backend/.venv/bin/pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planer
          POSTGRES_DB: planer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planer -d planer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://planer@localhost:5432/planer
      DATA_DIR: ./data
      IMPORT_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install ./backend
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Wersja Playwrighta
        id: pw
        run: echo "version=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache przeglądarek Playwrighta
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Zainstaluj przeglądarkę Playwrighta (z ponowieniami)
        timeout-minutes: 15
        working-directory: frontend
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          # wolne lub zawieszone pobierania z mirrora apt: krótki timeout i ponowienia po stronie apt
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-retries > /dev/null
          if [ "$CACHE_HIT" = "true" ]; then
            args="install-deps chromium"
          else
            args="install --with-deps chromium"
          fi
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 5m npx playwright $args; then
              exit 0
            fi
            echo "Próba $attempt nieudana lub przekroczono 5 min" >&2
            # po ubitej próbie apt może nadal trzymać blokadę dpkg
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npm --prefix frontend run test:e2e
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t planer-przepisow:ci .
  helm:
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/planer-przepisow
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Zainstaluj kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - run: helm lint "$CHART"
      - name: helm template (domyślny) | kubeconform
        run: helm template planer "$CHART" | kubeconform -strict -summary
      - name: helm template (wszystko włączone) | kubeconform
        run: |
          helm template planer "$CHART" \
            --set postgresql.enabled=true --set backup.enabled=true \
            --set ingress.enabled=true --set 'ingress.tls[0].secretName=planer-tls' \
            --set 'imagePullSecrets[0].name=pull' --set image.tag=0.1.0 \
            | kubeconform -strict -summary
      - name: helm template (baza zewnętrzna z url, istniejący PVC)
        run: |
          helm template planer "$CHART" \
            --set database.url=postgresql://u:p@h:5432/planer \
            --set persistence.existingClaim=dane \
            | kubeconform -strict -summary
  ci:
    if: always()
    needs: [backend, frontend, e2e, docker, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Wszystkie wymagane joby zakończyły się sukcesem
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
