name: Obraz
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dodatkowy tag obrazu, np. 0.1.0 (opcjonalnie)'
        required: false
        type: string
      latest:
        description: 'Oznacz też jako latest'
        required: true
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  obraz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wersja i flaga latest
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            latest=true
          else
            version="$INPUT_TAG"
            latest="$INPUT_LATEST"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/abudabi16955/planer-przepisow
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Podsumowanie
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Opublikowane tagi'
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
